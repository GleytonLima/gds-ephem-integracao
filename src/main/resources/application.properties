server.servlet.contextPath=/api-integracao/v1
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jpa.properties.hibernate.jdbc.batch_size=10

spring.data.rest.default-media-type=application/json

spring.datasource.url=jdbc:postgresql://${INTEGRACAO_DB_HOST}:${INTEGRACAO_DB_PORT}/${INTEGRACAO_DB_SCHEMA_NAME}
spring.datasource.username=${INTEGRACAO_DB_USERNAME}
spring.datasource.password=${INTEGRACAO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

odoo.url=${ODOO_URL}
odoo.db=${ODOO_DB}
odoo.user=${ODOO_USER}
odoo.apikey=${ODOO_APIKEY}
# idioma do context nas consultas XML-RPC; precisa estar ativo no Odoo (Cabo Verde: pt_PT)
odoo.lang=${ODOO_LANG:pt_BR}

# ePHEM API REST v2 (modulo ephem_api_base). Quando habilitada, os signals sao criados
# por POST /api/v2/signals em vez de XML-RPC. O XML-RPC continua em uso para mensagens e consultas.
ephem.v2.enabled=${EPHEM_V2_ENABLED:false}
ephem.v2.base-url=${EPHEM_V2_BASE_URL:}
ephem.v2.api-key=${EPHEM_V2_API_KEY:}
ephem.v2.external-id-prefix=${EPHEM_V2_EXTERNAL_ID_PREFIX:GDS-}

# URL completo do canal do Notify.events
notifyevents.channel.url=${NOTIFYEVENTS_CHANNEL_URL}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken%40system.gserviceaccount.com
